name: Atualizar painel do perfil

on:
  schedule:
    - cron: "0 9 * * *"      # todo dia às 06h (horário de Brasília)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar painel.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          # Usa o token pessoal se você criar o secret PAINEL_TOKEN; senão, o padrão do Actions
          GH_TOKEN: ${{ secrets.PAINEL_TOKEN || secrets.GITHUB_TOKEN }}
          FUSO: America/Sao_Paulo
        run: python scripts/gerar_painel.py

      - name: Salvar se mudou
        run: |
          git config user.name  "robo-do-painel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.svg
          git diff --staged --quiet || git commit -m "🩺 painel: novo laudo do dia"
          git push
